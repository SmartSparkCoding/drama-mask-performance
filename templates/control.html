{% extends "base.html" %}

{% block title %}Control | Drama Mask Performance{% endblock %}

{% block head %}
  <script defer src="{{ url_for('static', filename='control.js') }}"></script>
{% endblock %}

{% block body %}
  <main class="control-shell" data-current-status="{{ status }}">
    <section class="control-panel">
      <p class="eyebrow">Performance control</p>
      <h1>State <span id="status-value">{{ status }}</span></h1>
      <p class="description">Back and forward cycle the shared display state. The B key advances forward.</p>

      <div class="button-row">
        <button type="button" class="control-button secondary" id="back-button">Back</button>
        <button type="button" class="control-button primary" id="forward-button">Forward / B</button>
        <button type="button" class="control-button danger" id="reset-button">Reset</button>
      </div>
    </section>
  </main>
{% endblock %}
